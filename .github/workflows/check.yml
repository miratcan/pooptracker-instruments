# Every push and pull request: each instrument is checked with PoopTracker's own format code (tools/check.mjs).
# On main, index.json (the list PoopTracker loads the collection from) is then written from the instruments and
# committed when it changed: nobody writes it by hand, so it can't disagree with the files.
name: check
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  instruments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: miratcan/pooptracker
          path: .pooptracker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs .pooptracker ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && '--index' || '' }}
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git diff --quiet -- index.json && git ls-files --error-unmatch index.json >/dev/null 2>&1 && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'index.json from the instruments'
          git push
